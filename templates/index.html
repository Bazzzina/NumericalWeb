<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerical Analysis Solver</title>
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Numerical Analysis</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('roots', event)">Roots of Equations</button>
            <button class="tab-btn" onclick="openTab('linear', event)">Linear Systems</button>
        </div>

        <!-- Roots Tab -->
        <div id="roots" class="tab-content active">
            <div class="card">
                <div class="input-grid">
                    <div class="input-group" style="grid-column: span 2;">
                        <label for="eq">Function f(x)</label>
                        <input type="text" id="eq" value="x**3 - x - 2" placeholder="e.g. x**2 - 4">
                    </div>
                    <div class="input-group">
                        <label for="root-method">Method</label>
                        <select id="root-method">
                            <option value="Bisection">Bisection</option>
                            <option value="Newton">Newton-Raphson</option>
                            <option value="False Position">False Position</option>
                            <option value="Secant">Secant</option>
                            <option value="Fixed Point">Fixed Point</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="tol">Tolerance</label>
                        <input type="number" id="tol" value="0.01" step="0.001">
                    </div>
                    <div class="input-group">
                        <label for="xl">Lower Bound (xl / x0)</label>
                        <input type="number" id="xl" value="1" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="xu">Upper Bound (xu / x1)</label>
                        <input type="number" id="xu" value="2" step="0.1">
                    </div>
                    <div class="input-group" style="justify-content: flex-end;">
                        <button id="solve-root-btn" class="btn primary" onclick="solveRoots()">Solve Roots</button>
                    </div>
                </div>
            </div>

            <div id="root-error" class="error-msg"></div>

            <div class="table-container">
                <table id="roots-table">
                    <thead>
                        <tr>
                            <th>Iteration</th>
                            <th>Xl (Lower)</th>
                            <th>Xu (Upper)</th>
                            <th>Xr (Root)</th>
                            <th>Error (%)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Results injected here -->
                        <tr><td colspan="5" class="empty-state">Enter parameters and click solve to see iterations.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Linear Tab -->
        <div id="linear" class="tab-content">
            <div class="card">
                <div class="linear-controls">
                    <div class="input-group">
                        <label for="matrix-n">Matrix Size (n × n)</label>
                        <select id="matrix-n" onchange="generateGrid()">
                            <option value="2">2 × 2</option>
                            <option value="3" selected>3 × 3</option>
                            <option value="4">4 × 4</option>
                            <option value="5">5 × 5</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="lin-method">Solving Method</label>
                        <select id="lin-method">
                            <option value="Gauss Elimination">Gauss Elimination</option>
                            <option value="Cramer's Rule">Cramer's Rule</option>
                        </select>
                    </div>
                    <div class="input-group" style="justify-content: flex-end;">
                        <button id="solve-lin-btn" class="btn success" onclick="solveLinear()">Calculate Solution</button>
                    </div>
                </div>

                <div class="matrix-layout">
                    <div class="matrix-section">
                        <h3>Coefficient Matrix [A]</h3>
                        <div id="matrix-a-container" class="grid-container"></div>
                    </div>
                    <div class="matrix-section">
                        <h3 class="text-green">Constant Vector [b]</h3>
                        <div id="vector-b-container" class="grid-container"></div>
                    </div>
                </div>
            </div>

            <div id="linear-error" class="error-msg"></div>

            <div class="table-container">
                <table id="linear-table">
                    <thead>
                        <tr>
                            <th>Variable</th>
                            <th>Value</th>
                            <th>Calculation Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Results injected here -->
                        <tr><td colspan="3" class="empty-state">Enter matrix values and click calculate to see the solution.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
