<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerical Analysis Solver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1> Numerical Analysis Solver</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('roots')">Chapter 1: Roots</button>
            <button class="tab-btn" onclick="openTab('linear')">Chapter 2: Linear Equations</button>
        </div>

        <!-- Roots Tab -->
        <div id="roots" class="tab-content active">
            <div class="card">
                <div class="input-grid">
                    <div class="input-group">
                        <label>Equation f(x):</label>
                        <input type="text" id="eq" value="x**3 - x - 2">
                    </div>
                    <div class="input-group">
                        <label>Method:</label>
                        <select id="root-method">
                            <option>Bisection</option>
                            <option>Newton</option>
                            <option>False Position</option>
                            <option>Secant</option>
                            <option>Fixed Point</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Tolerance:</label>
                        <input type="number" id="tol" value="0.01" step="0.001">
                    </div>
                    <div class="input-group">
                        <label>Xl / X0:</label>
                        <input type="number" id="xl" value="1" step="0.1">
                    </div>
                    <div class="input-group">
                        <label>Xu / X1:</label>
                        <input type="number" id="xu" value="2" step="0.1">
                    </div>
                    <div class="input-group">
                        <label>&nbsp;</label>
                        <button class="btn primary" onclick="solveRoots()">Solve Root</button>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table id="roots-table">
                    <thead>
                        <tr>
                            <th>Iter</th><th>Xl</th><th>Xu</th><th>Xr</th><th>Error %</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Results injected here -->
                    </tbody>
                </table>
            </div>
            <div id="root-error" class="error-msg"></div>
        </div>

        <!-- Linear Tab -->
        <div id="linear" class="tab-content">
            <div class="card">
                <div class="linear-controls">
                    <div class="input-group">
                        <label>Matrix Size (n):</label>
                        <select id="matrix-n" onchange="generateGrid()">
                            <option value="2">2</option>
                            <option value="3" selected>3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Method:</label>
                        <select id="lin-method">
                            <option>Gauss Elimination</option>
                            <option>Cramer's Rule</option>
                            <option>Gauss-Jordan</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>&nbsp;</label>
                        <button class="btn success" onclick="solveLinear()">Solve System</button>
                    </div>
                </div>

                <div class="matrix-layout">
                    <div>
                        <h3>Matrix [A]</h3>
                        <div id="matrix-a-container" class="grid-container"></div>
                    </div>
                    <div>
                        <h3 class="text-green">Vector [b]</h3>
                        <div id="vector-b-container" class="grid-container"></div>
                    </div>
                </div>
            </div>

            <textarea id="linear-result" readonly placeholder="Solution will appear here..."></textarea>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
